name: Cross-Build-S3-N16R8-v4.4

on:
  workflow_dispatch:
  push:
    branches: 
      - master-v4.3

jobs:
  job1:
    name: Build Number
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.buildnumber.outputs.build_number }}
    steps:
    - name: Generate build number
      id: buildnumber
      run: |
        echo "build_number=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: job1
    strategy:
      matrix:
        platform: [S3-16-o-q-ads]
        depth: [16]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Build the firmware
      run: |
        docker pull espressif/idf:release-v4.4
        docker run --rm -v $PWD:/project -w /project espressif/idf:release-v4.4 /bin/bash -c "
          apt-get update && apt-get install -y zip protobuf-compiler && 
          python3 -m pip install protobuf==3.19.6 && 
          
          export IDF_TARGET=esp32s3 && 
          
          # 1. СОЗДАЕМ ЗАГЛУШКУ ETHERNET ЧЕРЕЗ ECHO (надежнее для Docker)
          mkdir -p components/wifi-manager && 
          echo '#ifndef ESP_ETH_H' > components/wifi-manager/esp_eth.h && 
          echo '#define ESP_ETH_H' >> components/wifi-manager/esp_eth.h && 
          echo '#include \"esp_err.h\"' >> components/wifi-manager/esp_eth.h && 
          echo '#include \"esp_event.h\"' >> components/wifi-manager/esp_eth.h && 
          echo 'typedef void* esp_eth_handle_t;' >> components/wifi-manager/esp_eth.h && 
          echo 'typedef struct { int dummy; } esp_eth_config_t;' >> components/wifi-manager/esp_eth.h && 
          echo 'typedef struct { int dummy; } esp_eth_phy_t;' >> components/wifi-manager/esp_eth.h && 
          echo 'typedef struct { int dummy; } esp_eth_mac_t;' >> components/wifi-manager/esp_eth.h && 
          echo '#define ETH_DEFAULT_CONFIG(mac, phy) {0}' >> components/wifi-manager/esp_eth.h && 
          echo 'static inline esp_err_t esp_eth_driver_install(const esp_eth_config_t *config, esp_eth_handle_t *out_hdl) { return 0; }' >> components/wifi-manager/esp_eth.h && 
          echo 'static inline esp_err_t esp_eth_driver_uninstall(esp_eth_handle_t hdl) { return 0; }' >> components/wifi-manager/esp_eth.h && 
          echo '#endif' >> components/wifi-manager/esp_eth.h && 
          
          # 2. ПОДГОТОВКА КОНФИГУРАЦИИ
          rm -rf build sdkconfig && 
          if [ -f build-scripts/${{ matrix.platform }}-sdkconfig.defaults ]; then 
            cp build-scripts/${{ matrix.platform }}-sdkconfig.defaults sdkconfig; 
          else 
            idf.py set-target esp32s3; 
          fi && 
          
          # 3. НАСТРОЙКИ ПАМЯТИ
          echo 'CONFIG_ESP32S3_SPIRAM_SUPPORT=y' >> sdkconfig && 
          echo 'CONFIG_SPIRAM_MODE_OCT=y' >> sdkconfig && 
          echo 'CONFIG_SPIRAM_TYPE_AUTO=y' >> sdkconfig && 
          echo 'CONFIG_SPIRAM_SIZE=-1' >> sdkconfig && 
          echo 'CONFIG_SPIRAM_SPEED_80M=y' >> sdkconfig && 
          echo 'CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y' >> sdkconfig && 
          echo 'CONFIG_ETH_ENABLED=n' >> sdkconfig && 
          
          # 4. ЗАПУСК СБОРКИ
          idf.py build -DDEPTH=${{ matrix.depth }} -DBUILD_NUMBER=${{ needs.job1.outputs.build_number }}
        "

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: squeezelite-s3-v4.4-build-${{ needs.job1.outputs.build_number }}
        path: |
          build/*.bin
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/sdkconfig
