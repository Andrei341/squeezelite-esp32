name: Cross-Build

on:
  workflow_dispatch:
  push:
    branches: 
      - master-v4.3
  pull_request:
    branches:
      - master-v4.3

jobs:
  job1:
    name: Build Number
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.buildnumber.outputs.build_number }}
    steps:
    - name: Generate common build number
      id: buildnumber
      uses: einaregilsson/build-number@v3
      with:
        token: ${{secrets.github_token}}

  build:
    runs-on: ubuntu-latest
    needs: job1
    strategy:
      max-parallel: 1
      matrix:
        platform: [S3-16-o-q-ads]
        depth: [16]
    steps:
    - name: Set target name
      run: |
        echo "TARGET_BUILD_NAME=${{ matrix.platform }}" >> $GITHUB_ENV
        echo "build_version_prefix=1." >> $GITHUB_ENV

    - uses: actions/checkout@v4
      with:
        fetch-depth: 15
        submodules: true

    - name: Set build parameters
      run: |
        git update-index --chmod=+x ./server_certs/getcert.sh
        cd server_certs; ./getcert.sh; cat github.pem; cd ..
        shopt -s nocasematch
        branch_name="${GITHUB_REF//refs\/heads\//}"
        branch_name="${branch_name//[^a-zA-Z0-9\-~!@_\.]/}"
        BUILD_NUMBER=${{ needs.job1.outputs.build_number }}
        echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_ENV
        tag="${TARGET_BUILD_NAME}.${{matrix.depth}}.${BUILD_NUMBER}.${branch_name}"
        echo "tag=${tag}" >> $GITHUB_ENV
        name="1.${BUILD_NUMBER}-${{matrix.depth}}#v4.0#${TARGET_BUILD_NAME}#${branch_name}"
        artifact_prefix="squeezelite-esp32-${branch_name}-${TARGET_BUILD_NAME}-${{matrix.depth}}-${build_version_prefix}${BUILD_NUMBER}"
        artifact_file_name="${artifact_prefix}.zip"
        echo "name=${name}" >> $GITHUB_ENV
        echo "artifact_file_name=${artifact_file_name}" >> $GITHUB_ENV
        echo "PROJECT_VER=${TARGET_BUILD_NAME}-${{ steps.buildnumber.outputs.build_number }} " >> $GITHUB_ENV

    - name: Build the firmware
      run: |
        env | grep "artifact\|tag\|GITHUB\|version\|NUMBER\|TARGET" >${TARGET_BUILD_NAME}-env.txt
        echo "${tag}" >version.txt
        docker pull espressif/idf:release-v4.3
        docker run --env-file=${TARGET_BUILD_NAME}-env.txt -v $PWD:/project -w /project espressif/idf:release-v4.3 /bin/bash -c "
          apt-get update && apt-get install -y zip protobuf-compiler && 
          python3 -m pip install protobuf==3.19.6 && 
          export LC_ALL=C.UTF-8 && 
          export IDF_TARGET=esp32s3 && 
          
          # ГЛОБАЛЬНЫЕ ИСПРАВЛЕНИЯ КОДА под ESP32-S3
          # 1. Заменяем устаревшую функцию GPIO во всех файлах компонентов
          find components -type f -name '*.[ch]' -exec sed -i 's/gpio_pad_select_gpio/esp_rom_gpio_pad_select_gpio/g' {} +
          
          # 2. Исправляем ADC_WIDTH_BIT_12 на 12 (совместимо с S3)
          find components -type f -name '*.[ch]' -exec sed -i 's/ADC_WIDTH_BIT_12/12/g' {} +
          
          # 3. Фикс драйвера rtc_sleep (удаляем содержимое, чтобы не было конфликтов)
          echo '' > /opt/esp/idf/components/esp_hw_support/port/esp32s3/rtc_sleep.c
          
          rm -rf build sdkconfig && 
          cp build-scripts/${TARGET_BUILD_NAME}-sdkconfig.defaults sdkconfig && 
          
          # Принудительно отключаем Ethernet (вызывает ошибки на S3)
          echo 'CONFIG_ETH_ENABLED=n' >> sdkconfig &&
          
          idf.py --preview set-target esp32s3 && 
          idf.py build -DIDF_TARGET=esp32s3 -DDEPTH=${{ matrix.depth }} -DBUILD_NUMBER=${{ needs.job1.outputs.build_number }}-${{ matrix.depth }} && 
          zip -r build_output.zip build"

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ env.artifact_file_name }}
        path: |
          build/*.bin
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build_output.zip
