name: Cross-Build-S3-N16R8-v4.4

on:
  workflow_dispatch:
  push:
    branches: 
      - master-v4.3

jobs:
  job1:
    name: Build Number
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.buildnumber.outputs.build_number }}
    steps:
    - name: Generate build number
      id: buildnumber
      run: |
        echo "build_number=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: job1
    strategy:
      matrix:
        platform: [S3-16-o-q-ads]
        depth: [16]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Build the firmware
      run: |
        docker pull espressif/idf:release-v4.4
        docker run --rm -v $PWD:/project -w /project espressif/idf:release-v4.4 /bin/bash -c "
          set -e
          apt-get update && apt-get install -y zip protobuf-compiler
          python3 -m pip install protobuf==3.19.6
          
          export IDF_TARGET=esp32s3
          
          # 1. ХИРУРГИЧЕСКОЕ УДАЛЕНИЕ ETHERNET ИЗ СБОРКИ
          # Удаляем файлы network_ethernet.c и драйверы из CMakeLists.txt компонента wifi-manager
          sed -i '/network_ethernet.c/d' components/wifi-manager/CMakeLists.txt
          sed -i '/network_driver_LAN8720.c/d' components/wifi-manager/CMakeLists.txt
          sed -i '/network_driver_W5500.c/d' components/wifi-manager/CMakeLists.txt
          
          # Также создаем пустую заглушку для заголовочного файла, чтобы другие файлы не падали
          mkdir -p components/wifi-manager
          echo '#ifndef ESP_ETH_H\n#define ESP_ETH_H\ntypedef void* esp_eth_handle_t;\n#endif' > components/wifi-manager/esp_eth.h

          # 2. ПОДГОТОВКА КОНФИГУРАЦИИ
          rm -rf build sdkconfig
          if [ -f build-scripts/${{ matrix.platform }}-sdkconfig.defaults ]; then
            cp build-scripts/${{ matrix.platform }}-sdkconfig.defaults sdkconfig
          else
            idf.py set-target esp32s3
          fi
          
          # 3. НАСТРОЙКИ ПАМЯТИ N16R8
          cat >> sdkconfig <<L_EOF
          CONFIG_ESP32S3_SPIRAM_SUPPORT=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_SPIRAM_TYPE_AUTO=y
          CONFIG_SPIRAM_SIZE=-1
          CONFIG_SPIRAM_SPEED_80M=y
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_ETH_ENABLED=n
          L_EOF
          
          # 4. СБОРКА
          idf.py build -DDEPTH=${{ matrix.depth }} -DBUILD_NUMBER=${{ needs.job1.outputs.build_number }}
        "

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: squeezelite-s3-v4.4-build-${{ needs.job1.outputs.build_number }}
        path: |
          build/*.bin
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/sdkconfig
